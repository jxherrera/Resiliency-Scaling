events { 
    worker_connections 1024; 
}

http {
    # Definición del cluster upstream hacia el servicio backend en Docker (puerto 3000)
    upstream backend_cluster {
        server backend-service:3000;
    }

    server {
        listen 80;
        server_name _;

        # Enrutamiento de peticiones HTTP al cluster de backend
        location / {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Deshabilitar cache para evidenciar Round Robin en cada petición
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires off;
        }
    }
}