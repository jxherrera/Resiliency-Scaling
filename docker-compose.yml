version: '3.8'

services:
  nginx-gateway:
    image: nginx:latest
    container_name: nginx-gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-service
    networks:
      - app-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

  backend-service:
    build: .
    image: finflow-backend:latest
    restart: always
    environment:
      - PORT=3000
      - DB_HOST=database
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-secret123}
      - DB_NAME=${DB_NAME:-finflow_db}
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          cpus: '0.10'
          memory: 64M
    networks:
      - app-net
    depends_on:
      - database

  database:
    image: postgres:15-alpine
    container_name: finflow_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret123}
      POSTGRES_DB: ${DB_NAME:-finflow_db}
    # HARDENING: NO SE EXPONEN PUERTOS AL HOST (sin la directiva ports:)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.20'
          memory: 128M
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  pgdata:
  backups: